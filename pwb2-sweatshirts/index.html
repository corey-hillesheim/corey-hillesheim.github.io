<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>PW B2 Black Sweatshirt Ranking</title>
<style>
:root{--b:#0b0d12;--c:#151a24;--blue:#2f8cff;--t:#e8eef8;--m:#93a1b8}
*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:640px;margin:auto;padding:20px 14px 60px}h1{font-size:1.6rem;margin:.2em 0;border-left:5px solid var(--blue);padding-left:10px}
.note{background:var(--c);border:1px solid #23304a;border-radius:12px;padding:12px 14px;color:var(--m);margin:12px 0 18px}.note b{color:var(--t)}
label{display:block;font-weight:600;margin:16px 0 6px}input,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #2a3550;background:var(--c);color:var(--t);font:inherit}
ol{list-style:none;padding:0;margin:0}li{display:flex;align-items:center;gap:10px;background:var(--c);border:1px solid #23304a;border-radius:12px;padding:8px;margin:8px 0;touch-action:none}
li.drag{opacity:.5;border-color:var(--blue)}.rk{min-width:42px;text-align:center;font-weight:800;color:var(--blue);font-size:1.1rem}
li img{width:84px;height:64px;object-fit:cover;border-radius:8px;cursor:zoom-in}.lb{flex:1;min-width:0;font-size:.95rem}.lb small{display:block;color:var(--m)}
.bt{display:flex;flex-direction:column;gap:4px}.bt button{width:40px;height:32px;border:0;border-radius:8px;background:#22304a;color:var(--t);font-size:1rem}
.h{cursor:grab;color:var(--m);font-size:1.3rem;padding:0 2px}
button.sub{width:100%;margin-top:20px;padding:15px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;font-size:1.1rem}button:disabled{opacity:.5}
#ok{display:none;text-align:center;padding:40px 10px}#ok h2{color:var(--blue)}#err{color:#ff7a7a;margin-top:10px}
#zoom{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9}#zoom img{max-width:96vw;max-height:92vh;border-radius:8px}
</style></head><body><main>
<div id="f"><h1>PW B2 Black Sweatshirt Ranking</h1>
<div class="note">Raven's mock-ups · <b>$40 each</b> · <b>25-sweatshirt minimum</b>.<br>Drag (or use ▲▼) to order all 7 — <b>1st = your favorite</b>. Tap a picture to enlarge.</div>
<form id="frm"><label for="pn">Player name <small style="color:var(--m);font-weight:400">(optional)</small></label><input id="pn" maxlength="80" autocomplete="off">
<label>Your ranking</label><ol id="list"></ol>
<label for="cm">Comments <small style="color:var(--m);font-weight:400">(optional)</small></label><textarea id="cm" rows="3" maxlength="1000"></textarea>
<button class="sub" id="sb" type="submit">Submit ranking</button><div id="err"></div></form></div>
<div id="ok"><h2>Thanks! 🏒</h2><p>Your ranking was submitted.</p></div></main>
<div id="zoom"><img alt=""></div>
<script>
const ENDPOINT="https://script.google.com/macros/s/AKfycbzAacEkQTf2LlsbWyVUPncb674yBHwzka5k8_4lg5Z5UW7gLLXs4A-iuifp3xAI1cF-lg/exec"; // Apps Script web app /exec URL
const O=["Blue-to-black fade","Black with neon-blue W","Black with blue lightning streaks","Blue/black fade, cream sleeve stripes","Cream/blue/black diagonal stripes","Blue with black splatter","Black with blue brush pattern"];
const L=document.getElementById('list'),sfx=n=>n+(["th","st","nd","rd"][n]||"th");
O.forEach((t,i)=>{const li=document.createElement('li');li.dataset.o=i+1;li.innerHTML=`<span class="h">⋮⋮</span><span class="rk"></span><img src="img/option${i+1}.jpg" alt="Option ${i+1}: ${t}" loading="lazy"><span class="lb">${t}<small>Option ${i+1}</small></span><span class="bt"><button type="button" aria-label="Move up">▲</button><button type="button" aria-label="Move down">▼</button></span>`;L.append(li)});
function num(){[...L.children].forEach((li,i)=>li.querySelector('.rk').textContent=sfx(i+1))}num();
L.addEventListener('click',e=>{const li=e.target.closest('li');if(!li)return;if(e.target.tagName=='IMG'){const z=document.getElementById('zoom');z.firstChild.src=e.target.src;z.style.display='flex';return}
if(e.target.tagName=='BUTTON'){if(e.target.textContent=='▲'&&li.previousElementSibling)L.insertBefore(li,li.previousElementSibling);else if(e.target.textContent=='▼'&&li.nextElementSibling)L.insertBefore(li.nextElementSibling,li);num();e.target.focus()}});
document.getElementById('zoom').onclick=e=>e.currentTarget.style.display='none';
let d=null;L.addEventListener('pointerdown',e=>{if(!e.target.closest('.h,.lb,.rk'))return;d=e.target.closest('li');d.classList.add('drag');d.setPointerCapture(e.pointerId)});
L.addEventListener('pointermove',e=>{if(!d)return;const o=[...L.children].find(x=>x!=d&&e.clientY<x.getBoundingClientRect().top+x.offsetHeight/2);o?L.insertBefore(d,o):L.append(d);num()});
const end=()=>{if(d){d.classList.remove('drag');d=null}};L.addEventListener('pointerup',end);L.addEventListener('pointercancel',end);
if(!ENDPOINT){const b=document.getElementById('sb');b.disabled=true;b.textContent='Voting opens soon'}
document.getElementById('frm').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('sb');b.disabled=true;b.textContent='Submitting…';
const p={player:pn.value.trim(),ranking:[...L.children].map(x=>+x.dataset.o),comments:cm.value.trim(),ua:navigator.userAgent.slice(0,120)};
try{await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(p)});f.style.display='none';ok.style.display='block';scrollTo(0,0)}
catch(x){err.textContent='Could not submit — check your connection and try again.';b.disabled=false;b.textContent='Submit ranking'}};
</script></body></html>
